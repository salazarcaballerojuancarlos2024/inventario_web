spring.application.name=invenario_web
# Desactivar cache de Thymeleaf
spring.thymeleaf.cache=false

# Ruta para guardar los planos
storage.location=C:/temp/inventario/planos

# Configuracion de la base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/inventario_db?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA e Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# URL configurable para el panel de Datos
config.url.externa=https://es.m.wikipedia.org