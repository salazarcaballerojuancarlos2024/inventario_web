<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Acceso Inventario</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

    <div class="login-container">
        <img th:src="@{/imagenes/logo_junta_v1.png}" alt="Logo Junta" class="logo-junta">
        
        <div class="texto-bienvenida">
            <span class="titulo">Bienvenido a Inventario</span>
            <span class="subtitulo">Dt Salud Málaga</span>
        </div>

        <p th:if="${error}" class="error-msg" th:text="${error}"></p>
        
        <form th:action="@{/login}" method="post" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
            <div class="form-group">
                <label>Usuario</label>
                <input type="text" name="usuario" required placeholder="Nombre de usuario">
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="password-container">
                    <input type="password" id="passInput" name="password" required placeholder="Contraseña">
                    <img th:src="@{/imagenes/ojo_cerrado.png}" 
                         id="eyeIcon" 
                         class="toggle-password" 
                         onclick="togglePass()"
                         alt="Ver">
                </div>
            </div>

            <button type="submit">Entrar</button>
        </form>
    </div>

    <script>
        /**
         * Alterna la visibilidad de la contraseña y cambia el icono del ojo
         */
        function togglePass() {
            const passInput = document.getElementById('passInput');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passInput.type === 'password') {
                passInput.type = 'text';
                // Asegúrate de que estas rutas coincidan con tus archivos en /static/imagenes/
                eyeIcon.src = /*[[@{/imagenes/ojo_abierto.png}]]*/ '/imagenes/ojo_abierto.png';
            } else {
                passInput.type = 'password';
                eyeIcon.src = /*[[@{/imagenes/ojo_cerrado.png}]]*/ '/imagenes/ojo_cerrado.png';
            }
        }
    </script>
</body>
</html>
