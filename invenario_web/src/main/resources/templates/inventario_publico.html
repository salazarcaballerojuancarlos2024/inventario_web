<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Visor Público de Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/sidebar_public.css}">
    <link rel="stylesheet" th:href="@{/css/inventario_publico.css}">
    <link rel="stylesheet" th:href="@{/css/vista-plano-publico.css}">
</head>
<body class="public-view">

    <div class="contenedor-publico">
        <aside class="sidebar-wrapper">
            <div th:replace="~{fragments/sidebar_public :: sidebar_public}"></div>
        </aside>

        <main class="contenido-principal">
            <div th:replace="~{fragments/vista-plano-publico :: plano_publico}"></div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function seleccionarPlanta(id) {
            window.location.href = "/publico?plantaId=" + id;
        }
    </script>
</body>
</html>
