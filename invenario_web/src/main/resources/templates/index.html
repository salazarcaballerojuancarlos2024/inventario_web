<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inventario - Panel Principal</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    
    <link rel="stylesheet" th:href="@{/css/layout.css(v=${version})}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css(v=${version})}">
    <link rel="stylesheet" th:href="@{/css/mapa.css(v=${version})}">
    <link rel="stylesheet" th:href="@{/css/iconos.css(v=${version})}">
    <link rel="stylesheet" th:href="@{/css/tooltips.css(v=${version})}">
    <link rel="stylesheet" th:href="@{/css/tablas.css(v=${version})}">
</head>
<body>

    <div class="main-wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <div class="map-area">
            
            <div id="vista-bienvenida" class="h-100 d-flex flex-column justify-content-center align-items-center" 
                 style="background-color: #f8f9fa; min-height: 100vh;">
                <div class="text-center" style="opacity: 0.2; user-select: none;">
                    <img th:src="@{/imagenes/inventario.png}" alt="Logo Inventario" style="width: 250px; margin-bottom: 20px;">
                    <h1 class="display-1 fw-bold" style="letter-spacing: 15px; color: #333;">INVENTARIO</h1>
                    <p class="fs-4 fw-light">SISTEMA DE GESTIÓN DE ACTIVOS</p>
                </div>
            </div>

            <div th:replace="~{fragments/vista-almacen :: almacen}"></div>

            <div th:replace="~{fragments/vista-gestion :: gestion}"></div>

            <div id="vista-datos-completos" class="h-100 seccion-oculta">
                <iframe th:src="${urlExterna}" style="width:100%; height:100%; border:none;"></iframe>
            </div>

            <div th:replace="~{fragments/vista-plano :: plano}"></div>
        </div>
    </div>

    <div th:replace="~{fragments/modales :: modal-edit}"></div>
    
    <script th:src="@{/js/config.js(v=${version})}"></script>
    <script th:src="@{/js/inventario-api.js(v=${version})}"></script>
    <script th:src="@{/js/inventario-ui.js(v=${version})}"></script>
    <script th:src="@{/js/inventario-drag.js(v=${version})}"></script>

    <script th:inline="javascript">
    window.modalInstancia = window.modalInstancia || null;

    window.onload = function() {
        // 1. Inicializar Modal de Edición
        const modalElement = document.getElementById('modalEditAsset');
        if (modalElement) {
            window.modalInstancia = new bootstrap.Modal(modalElement);
        }
        
        // 2. Lógica de Carga Inicial Inteligente
        const params = new URLSearchParams(window.location.search);
        
        /**
         * Prioridad de carga:
         * 1. Si la URL trae 'seccion', cargamos esa.
         * 2. Si la URL trae 'plantaId', cargamos 'vista-plano'.
         * 3. Por defecto (Tras Login), mostramos 'vista-bienvenida'.
         */
        let seccionInicial = 'vista-bienvenida'; 
        
        if (params.has('seccion')) {
            seccionInicial = params.get('seccion');
        } else if (params.has('plantaId')) {
            seccionInicial = 'vista-plano';
        }

        console.log("🚀 Sistema listo. Sección inicial:", seccionInicial);
        mostrarSeccion(seccionInicial);
    };
    </script>
</body>
</html>
