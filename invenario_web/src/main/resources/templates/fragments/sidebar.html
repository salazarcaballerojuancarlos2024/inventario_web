<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="sidebar" class="sidebar shadow">
        <div class="sidebar-header">
            <h5 class="m-0 fw-bold">Inventario</h5>
            <small class="opacity-75">Dt Salud Málaga</small>
        </div>

        <div class="accordion accordion-sidebar" id="accordionMenu">
			<div class="nav-direct-header"
				style="padding: 15px 20px; display: flex; align-items: center; gap: 10px;">
				<img th:src="@{/imagenes/panel-de-control.png}"
					class="menu-icon icon-white" style="width: 18px;"> <span
					style="font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; font-weight: bold;">
					Panel de Control </span>
			</div>

			<div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button"
                        data-bs-toggle="collapse" data-bs-target="#collapseGestion">
                        <img th:src="@{/imagenes/tuerca.png}" class="menu-icon">
                        Gestión
                    </button>
                </h2>
                <div id="collapseGestion" class="accordion-collapse collapse"
                    data-bs-parent="#accordionMenu">
                    <div class="accordion-body">
                        <a class="nav-link-custom" style="cursor: pointer;"
                            onclick="mostrarSeccion('vista-gestion-plantas')"> 
                            <img th:src="@{/imagenes/plano.png}" class="submenu-icon-fixed">
                            Plantas
                        </a> 
                        <a class="nav-link-custom" style="cursor: pointer;"
                            onclick="mostrarSeccion('vista-datos-completos')"> 
                            <img th:src="@{/imagenes/datos.png}" class="submenu-icon-fixed">
                            Datos
                        </a>
                    </div>
                </div>
            </div>

            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button"
                        data-bs-toggle="collapse" data-bs-target="#collapseVista">
                        <img th:src="@{/imagenes/Vista.png}" class="menu-icon">
                        Vista
                    </button>
                </h2>
                <div id="collapseVista" class="accordion-collapse collapse"
                    data-bs-parent="#accordionMenu">
                    <div class="accordion-body">
                        <div th:each="p : ${plantas}" th:if="${p.id != 1 and p.nombre != 'ALMACEN'}">
                            <a class="nav-link-custom" style="cursor: pointer;"
                                th:onclick="'seleccionarPlanta(' + ${p.id} + ')'"> 
                                <img th:src="@{/imagenes/plano.png}" class="submenu-icon-fixed">
                                <span th:text="${p.nombre}"></span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="sidebar-footer">
            <a class="nav-direct" th:href="@{/(seccion='vista-almacen')}"
                style="cursor: pointer; background: rgba(255, 255, 255, 0.1); border-radius: 8px;">
                <img th:src="@{/imagenes/almacen.png}" class="menu-icon"> <strong>Almacén</strong>
            </a>
            <hr class="text-white my-2">
            <a th:href="@{/login}" class="nav-link-custom text-danger fw-bold"
                style="padding-left: 15px !important;"> <img
                th:src="@{/imagenes/cerrar-sesion.png}" class="menu-icon">
                Salir
            </a>
        </div>
    </div>
</body>
</html>
