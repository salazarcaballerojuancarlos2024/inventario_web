<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
	<div th:fragment="plano" id="vista-plano" class="seccion-oculta">
		<div class="d-flex h-100 w-100 bg-light">

			<div
				class="area-mapa-principal d-flex align-items-center justify-content-center p-3 flex-grow-1"
				style="min-width: 0; position: relative;">

				<div th:if="${plantaSeleccionada == null}"
					class="d-flex flex-column align-items-center justify-content-center h-100 text-center p-5 bg-white shadow-sm rounded border">
					<div class="bg-light p-4 rounded-circle mb-4">
						<img th:src="@{/imagenes/panel-de-control.png}" alt="Inicio"
							style="width: 60px; opacity: 0.5;">
					</div>
					<h3 class="text-secondary fw-light">Panel de Inventario</h3>
					<p class="text-muted small">Seleccione una ubicación en el menú
						lateral para visualizar el plano.</p>
				</div>

				<div th:if="${plantaSeleccionada != null}"
					th:id="|contenedor-plano-${plantaSeleccionada.id}|"
					class="plano-background-container shadow-lg"
					th:style="|background-image: url('/planos-file/${plantaSeleccionada.imagenNombre}'); position: relative; min-height: 500px; overflow: visible !important;|">

					<div class="marca-agua-texto" th:text="${plantaSeleccionada.nombre}">NOMBRE PLANTA</div>

					<div th:each="asset : ${assets}"
						th:if="${asset.planta != null and asset.planta.id == plantaSeleccionada.id}"
						class="pc-icon drag-item" th:id="${asset.assetTag}"
						th:data-tag="${asset.assetTag}" data-x="0" data-y="0"
						th:data-x-pct="${asset.posX ?: 0}"
						th:data-y-pct="${asset.posY ?: 0}"
						th:style="|left: ${asset.posX ?: 0}%; top: ${asset.posY ?: 0}%; position: absolute;|"
						th:data-user="${asset.nombreUsuario ?: ''}"
						th:data-ram="${asset.ram ?: ''}" th:data-cpu="${asset.cpu ?: ''}"
						th:data-disco="${asset.disco ?: ''}"
						th:data-so="${asset.versionSo ?: ''}"
						th:data-otros="${asset.otros ?: ''}"
						th:data-planta-id="${asset.planta.id}"
						th:data-tipo="${asset.tipoEquipo ?: 'PC'}"
						onmouseenter="bridgeResaltar(this, true)"
						onmouseleave="bridgeResaltar(this, false)"
						ondblclick="prepararModalDesdeIcono(this)">

						<img
							th:src="${asset.tipoEquipo != null ? 
    (
        #strings.toLowerCase(asset.tipoEquipo) == 'portátil' or #strings.toLowerCase(asset.tipoEquipo) == 'portatil' ? '/imagenes/ordenador-portatil.png' :
        #strings.toLowerCase(asset.tipoEquipo) == 'impresora' ? '/imagenes/impresora.png' :
        #strings.toLowerCase(asset.tipoEquipo) == 'impresora-multifunción' ? '/imagenes/Impresora-Multifuncion.png' :
        '/imagenes/ordenador-sobremesa.png'
    ) : '/imagenes/ordenador-sobremesa.png'}"
							alt="Icono"> <span th:text="${asset.assetTag}"></span>

						<div class="tooltip-datos shadow">
							<div
								class="text-center fw-bold text-warning mb-1 border-bottom border-secondary pb-1">
								FICHA TÉCNICA</div>

							<div class="mb-1">
								<span class="label-tt">Tag:</span> <span
									th:text="${asset.assetTag}"></span>
							</div>
							<div class="mb-1">
								<span class="label-tt">Tipo:</span> <span
									th:text="${asset.tipoEquipo}"></span>
							</div>
							<div class="mb-1">
								<span class="label-tt">User:</span> <span
									th:text="${asset.nombreUsuario}"></span>
							</div>
							<div class="mb-1">
								<span class="label-tt">Ubicación:</span> <span
									th:text="${asset.planta.nombre}"></span>
							</div>

							<hr style="border-color: #555; margin: 5px 0;">

							<div class="mb-1">
								<span class="label-tt">RAM:</span> <span th:text="${asset.ram}"></span>
							</div>
							<div class="mb-1">
								<span class="label-tt">CPU:</span> <span th:text="${asset.cpu}"></span>
							</div>
							<div class="mb-1">
								<span class="label-tt">Disco:</span> <span
									th:text="${asset.disco}"></span>
							</div>
							<div class="mb-1">
								<span class="label-tt">S.O:</span> <span
									th:text="${asset.versionSo}"></span>
							</div>
							<div class="mb-1"
								th:if="${asset.otros != null and !asset.otros.empty}">
								<span class="label-tt">Otros:</span> <span
									th:text="${asset.otros}"
									style="color: #eee; font-size: 0.65rem;"></span>
							</div>

							<div
								class="text-end text-info mt-1 pt-1 border-top border-secondary"
								style="font-size: 0.65rem;">
								X: <span class="tt-pos-x" th:id="'tt-x-' + ${asset.assetTag}"
									th:text="${#numbers.formatDecimal(asset.posX ?: 0, 1, 2)} + '%'"></span>
								| Y: <span class="tt-pos-y" th:id="'tt-y-' + ${asset.assetTag}"
									th:text="${#numbers.formatDecimal(asset.posY ?: 0, 1, 2)} + '%'"></span>
							</div>
						</div>
					</div>
				</div>
			</div>

			<div
				class="sidebar-control-wrapper d-flex flex-column bg-dark border-start border-secondary p-3 shadow-lg"
				style="width: 20%; min-width: 280px; max-width: 320px; z-index: 100;">

				<h6
					class="text-uppercase fw-bold text-info mb-3 small border-bottom border-secondary pb-2">
					Traslado Rápido</h6>

				<div class="flex-grow-1 overflow-auto pe-1 mb-3">
					<div
						th:if="${plantaSeleccionada != null and plantaSeleccionada.id != 1}"
						class="planta-dropzone mb-2" data-planta-id="1">
						<div class="dropzone-label text-truncate">ALMACÉN CENTRAL</div>
						<small style="font-size: 0.6rem; opacity: 0.7;">SOLTAR
							PARA DEVOLVER</small>
					</div>

					<div th:each="p : ${plantas}"
						th:if="${p.id != 1 and (plantaSeleccionada == null or p.id != plantaSeleccionada.id)}"
						class="planta-dropzone mb-2" th:data-planta-id="${p.id}">
						<div class="dropzone-label text-truncate" th:text="${p.nombre}"></div>
						<small style="font-size: 0.6rem; opacity: 0.7;">SOLTAR
							PARA MOVER</small>
					</div>
				</div>

				<div class="d-grid gap-2 border-top border-secondary pt-3">
					<button type="button"
						class="btn btn-success btn-sm fw-bold shadow-sm d-flex align-items-center justify-content-center"
						th:if="${plantaSeleccionada != null}"
						th:attr="data-id=${plantaSeleccionada.id}"
						onclick="guardarPosicionesPlanta(this.getAttribute('data-id'))">
						<img th:src="@{/imagenes/disquete.png}" alt="" width="16"
							height="16" class="me-2"> GUARDAR CAMBIOS
					</button>

					<button type="button"
						class="btn btn-outline-light btn-sm d-flex align-items-center justify-content-center"
						th:if="${plantaSeleccionada != null}"
						th:attr="data-nombre=${plantaSeleccionada.nombre}"
						onclick="exportarDatosPlanta(this.getAttribute('data-nombre'))">
						<img th:src="@{/imagenes/descargas.png}" alt="" width="16"
							height="16" class="me-2"> EXPORTAR CSV
					</button>
				</div>
			</div>
		</div>
	</div>
</body>
