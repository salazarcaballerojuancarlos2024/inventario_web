<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
	<div th:fragment="plano2" id="vista-plano"
		class="h-100 w-100">

		<div th:if="${plantaSeleccionada == null}"
			class="d-flex flex-column align-items-center justify-content-center h-100 w-100 bg-light">
			<img th:src="@{/imagenes/inventario.png}"
				style="width: 200px; height: auto; opacity: 0.15; filter: grayscale(100%);"
				alt="Marca de agua Inventario">
			<h1
				style="font-size: 3rem; font-weight: 800; color: rgba(0, 0, 0, 0.1); text-transform: uppercase; margin-top: 20px;">
				Visor de Inventario</h1>
			<p class="text-muted opacity-50">Seleccione una planta en el menú
				lateral para visualizar los activos</p>
		</div>

		<div class="buscador-assets-container"
			style="position: absolute; top: 20px; right: 20px; z-index: 1000; width: 280px;">
			<div class="input-group shadow">
				<span class="input-group-text bg-white border-end-0"> <img
					th:src="@{/imagenes/buscador.png}" width="16" alt="Lupa">
				</span> <select id="buscadorAsset" class="form-select border-start-0">
					<option value="">Buscar usuario o activo...</option>
					<option th:each="a : ${assets}" th:value="${a.assetTag}"
						th:text="${a.nombreUsuario + ' (' + a.assetTag + ')'}"></option>
				</select>
			</div>
		</div>



		<div class="d-flex h-100 w-100 bg-light">


			<div
				class="area-mapa-principal d-flex align-items-center justify-content-center p-3 flex-grow-1"
				style="min-width: 0; position: relative;">



				<div th:if="${plantaSeleccionada != null}"
					th:id="|contenedor-plano-${plantaSeleccionada.id}|"
					class="plano-background-container shadow-lg"
					th:style="|background-image: url('/planos-file/${plantaSeleccionada.imagenNombre}'); 
					position: relative;
					min-height: 500px;
					background-color: white;
					overflow: visible !important;|">

					<div class="marca-agua-texto"
						th:text="${plantaSeleccionada.nombre}"></div>

					<div th:each="asset : ${assets}"
						th:if="${asset.planta != null and asset.planta.id == plantaSeleccionada.id}"
						class="pc-icon drag-item" th:id="${asset.assetTag}"
						th:data-tag="${asset.assetTag}" data-x="0" data-y="0"
						th:data-x-pct="${asset.posX ?: 0}"
						th:data-y-pct="${asset.posY ?: 0}"
						th:style="|left: ${asset.posX ?: 0}%; top: ${asset.posY ?: 0}%; position: absolute;|"
						th:data-user="${asset.nombreUsuario ?: ''}"
						th:data-ram="${asset.ram ?: ''}" th:data-cpu="${asset.cpu ?: ''}"
						th:data-disco="${asset.disco ?: ''}"
						th:data-so="${asset.versionSo ?: ''}"
						th:data-otros="${asset.otros ?: ''}"
						th:data-planta-id="${asset.planta.id}"
						th:data-tipo="${asset.tipoEquipo ?: 'PC'}"
						onmouseenter="bridgeResaltar(this, true)"
						onmouseleave="bridgeResaltar(this, false)"
						ondblclick="prepararModalDesdeIcono(this)">

						<img
							th:src="${asset.tipoEquipo != null ? 
    (
        #strings.toLowerCase(asset.tipoEquipo) == 'portátil' or #strings.toLowerCase(asset.tipoEquipo) == 'portatil' ? '/imagenes/ordenador-portatil.png' :
        #strings.toLowerCase(asset.tipoEquipo) == 'impresora' ? '/imagenes/impresora.png' :
        #strings.toLowerCase(asset.tipoEquipo) == 'impresora-multifunción' ? '/imagenes/Impresora-Multifuncion.png' :
        '/imagenes/ordenador-sobremesa.png'
    ) : '/imagenes/ordenador-sobremesa.png'}"
							alt="Icono"> <span th:text="${asset.assetTag}"></span>

						<div class="tooltip-datos shadow">
							<div
								class="text-center fw-bold text-warning mb-1 border-bottom border-secondary pb-1">
								FICHA TÉCNICA</div>

							<div class="mb-1">
								<span class="label-tt">Tag:</span> <span
									th:text="${asset.assetTag}"></span>
							</div>
							<div class="mb-1">
								<span class="label-tt">Tipo:</span> <span
									th:text="${asset.tipoEquipo}"></span>
							</div>
							<div class="mb-1">
								<span class="label-tt">User:</span> <span
									th:text="${asset.nombreUsuario}"></span>
							</div>
							<div class="mb-1">
								<span class="label-tt">Ubicación:</span> <span
									th:text="${asset.planta.nombre}"></span>
							</div>

							<hr style="border-color: #555; margin: 5px 0;">

							<div class="mb-1">
								<span class="label-tt">RAM:</span> <span th:text="${asset.ram}"></span>
							</div>
							<div class="mb-1">
								<span class="label-tt">CPU:</span> <span th:text="${asset.cpu}"></span>
							</div>
							<div class="mb-1">
								<span class="label-tt">Disco:</span> <span
									th:text="${asset.disco}"></span>
							</div>
							<div class="mb-1">
								<span class="label-tt">S.O:</span> <span
									th:text="${asset.versionSo}"></span>
							</div>
							<div class="mb-1"
								th:if="${asset.otros != null and !asset.otros.empty}">
								<span class="label-tt">Otros:</span> <span
									th:text="${asset.otros}"
									style="color: #eee; font-size: 0.65rem;"></span>
							</div>

							<div
								class="text-end text-info mt-1 pt-1 border-top border-secondary"
								style="font-size: 0.65rem;">
								X: <span class="tt-pos-x" th:id="'tt-x-' + ${asset.assetTag}"
									th:text="${#numbers.formatDecimal(asset.posX ?: 0, 1, 2)} + '%'"></span>
								| Y: <span class="tt-pos-y" th:id="'tt-y-' + ${asset.assetTag}"
									th:text="${#numbers.formatDecimal(asset.posY ?: 0, 1, 2)} + '%'"></span>
							</div>
						</div>
					</div>
				</div>
			</div>


		</div>
	</div>

	
	<script th:inline="javascript">
    // Usamos esta forma para asegurar que se ejecute incluso si el fragmento se carga dinámicamente
    (function($) {
        $(document).ready(function() {
            const rutaAvatar = /*[[@{/imagenes/avatar.png}]]*/ '/imagenes/avatar.png';

            function formatState(state) {
                if (!state.id) return state.text;
                return $(
                    '<span class="diseno-opcion-select2">' +
                        '<img src="' + rutaAvatar + '" class="avatar-select2" /> ' +
                        '<span class="texto-select2-personalizado">' + state.text + '</span>' +
                    '</span>'
                );
            };

            // Inicializar Select2
            $('#buscadorAsset').select2({
                theme: "bootstrap-5",
                width: '100%',
                placeholder: "Buscar usuario o activo...",
                allowClear: true,
                templateResult: formatState,
                templateSelection: formatState
            }).on('select2:select', function (e) {
                const assetTag = e.params.data.id;
                const el = document.getElementById(assetTag);
                if (el) {
                    $(el).css({'transform': 'scale(3)', 'transition': '0.5s', 'z-index': '9999'});
                    setTimeout(() => $(el).css('transform', 'scale(1)'), 2000);
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            });
        });
    })(jQuery);
</script>
</body>
