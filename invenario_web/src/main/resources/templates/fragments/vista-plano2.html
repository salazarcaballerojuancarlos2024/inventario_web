<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
	<div th:fragment="plano2" id="vista-plano" class="h-100 w-100">
		<input type="hidden" id="plantaActualIdHidden"
			th:value="${plantaSeleccionada != null ? plantaSeleccionada.id : ''}">

		<style>
/* 1. ESTADO BASE DEL ICONO */
.pc-icon {
	transform-origin: center center !important;
	transition: transform 0.5s ease, filter 0.5s ease, z-index 0s;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
}

/* 2. CLASE DE RESALTADO */
.buscado-resaltar {
	transform: scale(4) !important;
	z-index: 10000 !important;
	filter: drop-shadow(0 0 15px #ffc107) saturate(1.5) !important;
}

/* --- PANEL DE CONTROL DERECHO --- */
.buscador-assets-container {
	position: absolute;
	top: 20px;
	right: 20px;
	z-index: 5000; /* Bajamos un poco para no tapar modales pero que siga arriba */
	width: 300px;
	display: flex;
	flex-direction: column;
	gap: 10px;
}

#listaResultados {
	display: none;
	position: absolute;
	width: 100%;
	top: 46px;
	max-height: 350px;
	overflow-y: auto;
	background-color: white !important;
	border: 1px solid #ddd;
	border-radius: 0 0 8px 8px;
	box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
	z-index: 5001;
}

.opcion-personalizada {
	padding: 12px;
	border-bottom: 1px solid #eee;
	cursor: pointer;
	transition: background-color 0.2s;
	background-color: white !important;
	display: flex;
	align-items: center;
}

.opcion-personalizada:hover {
	background-color: #f0f7ff !important;
}

.usuario-nombre {
	font-weight: 800;
	color: #2c3e50;
	font-size: 1.05rem;
}

/* Estilos para el Switch */
.switch {
	position: relative;
	display: inline-block;
	width: 40px;
	height: 22px;
}

.switch input { opacity: 0; width: 0; height: 0; }

.slider {
	position: absolute;
	cursor: pointer;
	top: 0; left: 0; right: 0; bottom: 0;
	background-color: #ccc;
	transition: .4s;
	border-radius: 34px;
}

.slider:before {
	position: absolute;
	content: "";
	height: 16px; width: 16px;
	left: 3px; bottom: 3px;
	background-color: white;
	transition: .4s;
	border-radius: 50%;
}

input:checked+.slider { background-color: #2e7d32; }
input:checked+.slider:before { transform: translateX(18px); }

/* --- Modo Usuario Activo --- */
.modo-usuario-activo .pc-icon.tiene-usuario img {
    content: url('/imagenes/avatar.png') !important;
    border-radius: 50%;
    background-color: white;
    padding: 2px;
    border: 2px solid #2e7d32;
}

.modo-usuario-activo .pc-icon.tiene-usuario > span {
    color: #1b5e20 !important;
    font-weight: 800 !important;
    background: rgba(255, 255, 255, 0.9);
    padding: 1px 6px;
    border-radius: 4px;
    border: 1px solid #c8e6c9;
    z-index: 5;
}

.modo-usuario-activo .pc-icon:not(.tiene-usuario) {
    opacity: 0.4;
    filter: grayscale(100%);
}
</style>

		<div th:if="${plantaSeleccionada == null}"
			class="d-flex flex-column align-items-center justify-content-center h-100 w-100 bg-light">
			<img th:src="@{/imagenes/inventario.png}"
				style="width: 200px; height: auto; opacity: 0.15; filter: grayscale(100%);"
				alt="Marca de agua Inventario">
			<h1 style="font-size: 3rem; font-weight: 800; color: rgba(0, 0, 0, 0.1); text-transform: uppercase; margin-top: 20px;">
				Visor de Inventario</h1>
			<p class="text-muted opacity-50">Seleccione una planta en el menú lateral para visualizar los activos</p>
		</div>

		<div class="buscador-assets-container">

			<div class="input-group shadow" style="position: relative;">
				<span class="input-group-text bg-white"> <img
					th:src="@{/imagenes/buscador.png}" width="18">
				</span> <input type="text" id="inputBuscador" class="form-control"
					placeholder="Buscar usuario..." autocomplete="off"
					style="font-size: 1.1rem; height: 45px; font-weight: bold;">

				<div id="listaResultados">
					<th:block th:each="a : ${assets}">
						<div class="opcion-personalizada d-flex align-items-center"
							th:if="${a.planta != null}" th:data-tag="${a.assetTag}"
							th:data-nombre="${a.nombreUsuario}"
							th:data-planta-id="${a.planta.id}"
							th:style="${plantaSeleccionada != null and a.planta.id == plantaSeleccionada.id ? 'padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; background-color: white !important; display: flex;' : 'display: none;'}">

							<img th:src="@{/imagenes/avatar.png}"
								style="width: 30px; height: 30px; border-radius: 50%; margin-right: 12px;">

							<div class="d-flex flex-column">
								<span class="usuario-nombre"
									style="font-weight: 800; color: black; font-size: 1.1rem; display: block;"
									th:text="${a.nombreUsuario}"></span> <span
									style="color: #666; font-size: 0.85rem;"
									th:text="${a.assetTag}"></span>
							</div>
						</div>
					</th:block>
				</div>
			</div>

			<div class="bg-white p-2 shadow-sm"
				style="border-radius: 8px; border: 1px solid #ddd;">
				<div class="d-flex align-items-center justify-content-between mb-2">
					<div class="d-flex align-items-center">
						<img th:src="@{/imagenes/avatar.png}"
							style="width: 20px; margin-right: 10px;"> <span
							style="font-weight: bold; font-size: 0.9rem; color: #555;">Modo
							Usuario</span>
					</div>
					<label class="switch"> <input type="checkbox"
						id="checkModoUsuario"> <span class="slider round"></span>
					</label>
				</div>

				<button type="button" id="btnExportarCSV"
					class="btn btn-dark btn-sm w-100 d-flex align-items-center justify-content-center"
					style="border-radius: 6px; font-weight: bold; height: 35px;">
					<img th:src="@{/imagenes/descargas.png}"
						style="width: 16px; margin-right: 8px; filter: invert(1);">
					Exportar Planta (.CSV)
				</button>

				<div id="contadorAssets" class="text-center mt-2"
					style="font-size: 0.7rem; color: #888; font-weight: 800; text-transform: uppercase; border-top: 1px solid #eee; padding-top: 5px;">
					Activos en esta planta: <span id="numeroAssets"
						th:text="${assets != null ? assets.size() : '0'}">0</span>
				</div>
			</div>
		</div>

		<div class="d-flex h-100 w-100 bg-light">
			<div
				class="area-mapa-principal d-flex align-items-center justify-content-center p-3 flex-grow-1"
				style="min-width: 0; position: relative;">

				<div th:if="${plantaSeleccionada != null}"
					th:id="|contenedor-plano-${plantaSeleccionada.id}|"
					class="plano-background-container shadow-lg"
					th:style="|background-image: url('/planos-file/${plantaSeleccionada.imagenNombre}'); 
					position: relative;
					min-height: 500px;
					background-color: white;
					overflow: visible !important;|">

					<div class="marca-agua-texto"
						th:text="${plantaSeleccionada.nombre}"></div>

					<div th:each="asset : ${assets}"
						th:if="${asset.planta != null and asset.planta.id == plantaSeleccionada.id}"
						class="pc-icon drag-item" th:id="${asset.assetTag}"
						th:data-tag="${asset.assetTag}" data-x="0" data-y="0"
						th:data-x-pct="${asset.posX ?: 0}"
						th:data-y-pct="${asset.posY ?: 0}"
						th:style="|left: ${asset.posX ?: 0}%; top: ${asset.posY ?: 0}%; position: absolute;|"
						th:data-user="${asset.nombreUsuario ?: ''}"
						th:data-ram="${asset.ram ?: ''}" th:data-cpu="${asset.cpu ?: ''}"
						th:data-disco="${asset.disco ?: ''}"
						th:data-so="${asset.versionSo ?: ''}"
						th:data-otros="${asset.otros ?: ''}"
						th:data-planta-id="${asset.planta.id}"
						th:data-tipo="${asset.tipoEquipo ?: 'PC'}"
						onmouseenter="bridgeResaltar(this, true)"
						onmouseleave="bridgeResaltar(this, false)"
						ondblclick="prepararModalDesdeIcono(this)">

						<img
							th:src="${asset.tipoEquipo != null ? 
    (
        #strings.toLowerCase(asset.tipoEquipo) == 'portátil' or #strings.toLowerCase(asset.tipoEquipo) == 'portatil' ? '/imagenes/ordenador-portatil.png' :
        #strings.toLowerCase(asset.tipoEquipo) == 'impresora' ? '/imagenes/impresora.png' :
        #strings.toLowerCase(asset.tipoEquipo) == 'impresora-multifunción' ? '/imagenes/Impresora-Multifuncion.png' :
        '/imagenes/ordenador-sobremesa.png'
    ) : '/imagenes/ordenador-sobremesa.png'}"
							alt="Icono"> <span th:text="${asset.assetTag}"></span>

						<div class="tooltip-datos shadow">

							<div
								class="text-center fw-bold text-warning mb-1 border-bottom border-secondary pb-1">

								FICHA TÉCNICA</div>



							<div class="mb-1">

								<span class="label-tt">Tag:</span> <span
									th:text="${asset.assetTag}"></span>

							</div>

							<div class="mb-1">

								<span class="label-tt">Tipo:</span> <span
									th:text="${asset.tipoEquipo}"></span>

							</div>

							<div class="mb-1">

								<span class="label-tt">User:</span> <span
									th:text="${asset.nombreUsuario}"></span>

							</div>

							<div class="mb-1">

								<span class="label-tt">Ubicación:</span> <span
									th:text="${asset.planta.nombre}"></span>

							</div>



							<hr style="border-color: #555; margin: 5px 0;">



							<div class="mb-1">

								<span class="label-tt">RAM:</span> <span th:text="${asset.ram}"></span>

							</div>

							<div class="mb-1">

								<span class="label-tt">CPU:</span> <span th:text="${asset.cpu}"></span>

							</div>

							<div class="mb-1">

								<span class="label-tt">Disco:</span> <span
									th:text="${asset.disco}"></span>

							</div>

							<div class="mb-1">

								<span class="label-tt">S.O:</span> <span
									th:text="${asset.versionSo}"></span>

							</div>

							<div class="mb-1"
								th:if="${asset.otros != null and !asset.otros.empty}">

								<span class="label-tt">Otros:</span> <span
									th:text="${asset.otros}"
									style="color: #eee; font-size: 0.65rem;"></span>

							</div>



							<div
								class="text-end text-info mt-1 pt-1 border-top border-secondary"
								style="font-size: 0.65rem;">

								X: <span class="tt-pos-x" th:id="'tt-x-' + ${asset.assetTag}"
									th:text="${#numbers.formatDecimal(asset.posX ?: 0, 1, 2)} + '%'"></span>

								| Y: <span class="tt-pos-y" th:id="'tt-y-' + ${asset.assetTag}"
									th:text="${#numbers.formatDecimal(asset.posY ?: 0, 1, 2)} + '%'"></span>

							</div>

						</div>
					</div>
				</div>
			</div>
		</div>

		<script th:inline="javascript">
	$(document).ready(function() {
    const $body = $('body');

    // 1. Buscador: Clic y Filtrado
    $body.on('click', '#inputBuscador', function(e) {
        e.stopPropagation();
        const plantaId = $('#plantaActualIdHidden').val();
        let found = 0;
        $('.opcion-personalizada').each(function() {
            const dataPlanta = $(this).attr('data-planta-id');
            if (plantaId && dataPlanta == plantaId) {
                $(this).css('display', 'flex');
                found++;
            } else {
                $(this).hide();
            }
        });
        if (found > 0) $('#listaResultados').show();
    });

    $body.on('input', '#inputBuscador', function() {
        const val = $(this).val().toLowerCase().trim();
        const plantaId = $('#plantaActualIdHidden').val();
        let found = 0;
        $('.opcion-personalizada').each(function() {
            const nombre = ($(this).data('nombre') || "").toString().toLowerCase();
            const tag = ($(this).data('tag') || "").toString().toLowerCase();
            const esMismaPlanta = $(this).attr('data-planta-id') == plantaId;
            if (esMismaPlanta && (nombre.includes(val) || tag.includes(val))) {
                $(this).css('display', 'flex');
                found++;
            } else {
                $(this).hide();
            }
        });
        if (found > 0) $('#listaResultados').show();
        else $('#listaResultados').hide();
    });

    // 2. Selección de resultado
    $body.on('mousedown', '.opcion-personalizada', function(e) {
        const tag = $(this).attr('data-tag');
        const nombre = $(this).attr('data-nombre');
        $('#inputBuscador').val(nombre);
        $('#listaResultados').hide();
        const $target = $('#' + tag);
        if ($target.length) {
            $target[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
            $target.addClass('buscado-resaltar');
            setTimeout(() => { $target.removeClass('buscado-resaltar'); }, 2500);
        }
    });
 
    // 3. Modo Usuario
    $body.on('change', '#checkModoUsuario', function() {
        const $contenedorPlano = $('.plano-background-container');
        const activar = $(this).is(':checked');
        if (activar) {
            $contenedorPlano.addClass('modo-usuario-activo');
            $('.pc-icon').each(function() {
                const nombreUsuario = $(this).data('user');
                if (nombreUsuario && nombreUsuario.toString().trim() !== "") {
                    $(this).addClass('tiene-usuario').children('span').text(nombreUsuario);
                }
            });
        } else {
            $contenedorPlano.removeClass('modo-usuario-activo');
            $('.pc-icon').each(function() {
                $(this).removeClass('tiene-usuario').children('span').text($(this).data('tag'));
            });
        }
    });

    /*<![CDATA[*/
 // ... el resto de tu código ...

 // 4. Exportar CSV (Asegúrate de que esta parte esté exactamente así)
 $body.on('click', '#btnExportarCSV', function() {
     // Definimos las columnas
     const headers = ["Asset Tag", "Usuario", "Tipo", "RAM", "CPU", "Disco", "S.O.", "Pos X", "Pos Y"];
     const rows = [headers];
     
     $('.pc-icon:visible').each(function() {
         const $el = $(this);
         rows.push([
             '"' + ($el.data('tag') || '') + '"',
             '"' + ($el.data('user') || '') + '"',
             '"' + ($el.data('tipo') || '') + '"',
             '"' + ($el.data('ram') || '') + '"',
             '"' + ($el.data('cpu') || '') + '"',
             '"' + ($el.data('disco') || '') + '"',
             '"' + ($el.data('so') || '') + '"',
             '"' + ($el.attr('data-x-pct') || '0') + '%"',
             '"' + ($el.attr('data-y-pct') || '0') + '%"'
         ]);
     });

     // Usamos coma o punto y coma dependiendo de tu Excel local
     let csvContent = "data:text/csv;charset=utf-8,\uFEFF" 
         + rows.map(e => e.join(";")).join("\n");
         
     const encodedUri = encodeURI(csvContent);
     const link = document.createElement("a");
     link.setAttribute("href", encodedUri);
     link.setAttribute("download", "Inventario_Planta.csv");
     document.body.appendChild(link);
     link.click();
     document.body.removeChild(link);
 });

 /*]]>*/

    $(document).on('click', function(e) {
        if (!$(e.target).closest('.buscador-assets-container').length) $('#listaResultados').hide();
    });
});
	</script>
	</div>
</body>
</html>
