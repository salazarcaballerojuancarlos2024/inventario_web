<div th:fragment="datos" id="vista-Datos" class="seccion-oculta container-fluid mt-4" style="display: none;">
    <div class="card shadow-sm border-0 bg-dark text-white">

        <div class="card-header border-secondary p-3">
            <div class="row g-3 align-items-center">
                <div class="col-md-3">
                    <h5 class="mb-0 text-info">
                        <i class="bi bi-database-fill me-2"></i>Gestión de Activos
                    </h5>
                </div>

                <div class="col-md-2">
                    <div class="input-group input-group-sm">
                        <label class="input-group-text bg-secondary border-secondary text-white">Ver</label>
                        <select id="maxRows" class="form-select bg-dark text-white border-secondary" onchange="cambiarPaginacion()">
                            <option value="10">10</option>
                            <option value="20">20</option>
                            <option value="30">30</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                            <option value="5000">Todos</option>
                        </select>
                    </div>
                </div>

				<div class="col-md-4">
					<div class="input-group input-group-sm">
						<span class="input-group-text bg-secondary border-secondary p-1">
							<img th:src="@{/imagenes/buscador.png}" alt="buscar"
							style="width: 20px; height: 20px;">
						</span> <input type="text" id="inputBusquedaAssets"
							class="form-control bg-dark text-white border-secondary"
							placeholder="Buscar en todas las columnas..."
							oninput="ejecutarFiltroYPaginacion()" autocomplete="off">
					</div>
				</div>

				<div class="col-md-3 text-end">
					<button class="btn btn-success btn-sm shadow"
						onclick="abrirModalCrear()">
						<i class="bi bi-plus-circle me-1"></i> Nuevo Activo
					</button>
				</div>
			</div>
        </div>

        <div class="card-body p-0" style="max-height: 65vh; overflow-y: auto;">
            <div class="table-responsive">
                <table id="tablaAssets" class="table table-dark table-hover mb-0 align-middle">
                    <thead class="table-secondary sticky-top" style="top: 0; z-index: 10;">
                        <tr>
                            <th onclick="ordenarTablaPaginada(0)" style="width: 120px; cursor: pointer;">Tag <span class="sort-icon">↕</span></th>
                            <th onclick="ordenarTablaPaginada(1)" style="width: 180px; cursor: pointer;">Usuario <span class="sort-icon">↕</span></th>
                            <th onclick="ordenarTablaPaginada(2)" style="width: 100px; cursor: pointer;">Tipo <span class="sort-icon">↕</span></th>
                            <th onclick="ordenarTablaPaginada(3)" style="width: 150px; cursor: pointer;">Ubicación <span class="sort-icon">↕</span></th>
                            <th onclick="ordenarTablaPaginada(4)" style="width: 100px; cursor: pointer;">RAM <span class="sort-icon">↕</span></th>
                            <th onclick="ordenarTablaPaginada(5)" style="width: 150px; cursor: pointer;">CPU <span class="sort-icon">↕</span></th>
                            <th onclick="ordenarTablaPaginada(6)" style="width: 100px; cursor: pointer;">Disco <span class="sort-icon">↕</span></th>
                            <th onclick="ordenarTablaPaginada(7)" style="width: 120px; cursor: pointer;">S.O. <span class="sort-icon">↕</span></th>
                            <th onclick="ordenarTablaPaginada(8)" style="width: 200px; cursor: pointer;">Otros <span class="sort-icon">↕</span></th>
                            <th class="text-center" style="width: 170px; min-width: 170px;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
						<th:block th:if="${todosLosAssets != null}">
							<tr th:each="asset : ${todosLosAssets}"
								th:id="'fila-' + ${asset.assetTag}" class="fila-asset">

								<td class="fw-bold text-info" th:text="${asset.assetTag}"></td>
								<td th:text="${asset.nombreUsuario}"></td>
								<td><span class="badge"
									th:classappend="${asset.tipoEquipo == 'Portátil' ? 'bg-primary' : 'bg-secondary'}"
									th:text="${asset.tipoEquipo}"></span></td>
								<td
									th:text="${asset.planta != null ? asset.planta.nombre : 'Sin Ubicación'}"></td>
								<td th:text="${asset.ram}"></td>
								<td th:text="${asset.cpu}"></td>
								<td th:text="${asset.disco}"></td>
								<td th:text="${asset.versionSo}"></td>
								<td class="text-truncate" style="max-width: 150px;"
									th:text="${asset.otros}" th:title="${asset.otros}"></td>

								<td class="text-center">
									<div class="btn-group">
										<button
											class="btn btn-warning btn-compact d-flex align-items-center gap-1"
											th:data-tag="${asset.assetTag}"
											th:data-user="${asset.nombreUsuario}"
											th:data-ram="${asset.ram}" th:data-cpu="${asset.cpu}"
											th:data-disco="${asset.disco}"
											th:data-so="${asset.versionSo}"
											th:data-otros="${asset.otros}"
											th:data-planta-id="${asset.planta?.id}"
											th:data-tipo="${asset.tipoEquipo}"
											onclick="editarDesdeTabla(this)">
											<i class="bi bi-pencil-square"></i> <span>Editar</span>
										</button>

										<button
											class="btn btn-danger btn-compact d-flex align-items-center gap-1"
											th:data-tag="${asset.assetTag}"
											onclick="confirmarEliminarAsset(this.getAttribute('data-tag'))">
											<i class="bi bi-trash"></i> <span>Borrar</span>
										</button>
									</div>
								</td>
							</tr>
						</th:block>
					</tbody>
                </table>
            </div>
        </div>

        <div class="card-footer border-secondary d-flex justify-content-between align-items-center bg-darker p-2">
            <div>
                <nav><ul class="pagination pagination-sm mb-0" id="pagination-wrapper"></ul></nav>
            </div>
            <div class="text-muted small">
                Mostrando <span id="countPage" class="text-info fw-bold">0</span> de 
                <span id="countTotal" class="text-white fw-bold" th:text="${todosLosAssets != null ? #lists.size(todosLosAssets) : 0}">0</span> activos
            </div>
        </div>
    </div>
</div>
