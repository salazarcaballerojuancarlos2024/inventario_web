<div th:fragment="datos" id="vista-Datos" class="seccion-oculta container-fluid mt-4">
    <div class="card shadow-sm border-0 bg-dark text-white">
        <div class="card-header border-secondary d-flex justify-content-between align-items-center">
            <h5 class="mb-0 text-info"><i class="bi bi-database-fill me-2"></i>Gestión de Activos</h5>
            <button class="btn btn-success btn-sm shadow" onclick="abrirModalCrear()">
                <i class="bi bi-plus-circle me-1"></i> Añadir Activo
            </button>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table id="tablaAssets" class="table table-dark table-hover mb-0 align-middle">
                    <thead class="table-secondary">
                        <tr>
                            <th>Tag</th>
                            <th>Usuario</th>
                            <th>Tipo</th>
                            <th>Ubicación</th>
                            <th>RAM</th>
                            <th>CPU</th>
                            <th>Disco</th>
                            <th>S.O.</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="asset : ${todosLosAssets}" th:id="'fila-datos-' + ${asset.assetTag}">
                            <td class="fw-bold text-info" th:text="${asset.assetTag}"></td>
                            <td th:text="${asset.nombreUsuario}"></td>
                            <td>
                                <span class="badge" 
                                      th:classappend="${asset.tipoEquipo == 'Portátil' ? 'bg-primary' : 'bg-secondary'}"
                                      th:text="${asset.tipoEquipo}"></span>
                            </td>
                            <td th:text="${asset.planta != null ? asset.planta.nombre : 'Sin Ubicación'}"></td>
                            <td th:text="${asset.ram}"></td>
                            <td th:text="${asset.cpu}"></td>
                            <td th:text="${asset.disco}"></td>
                            <td th:text="${asset.versionSo}"></td>
                            <td class="text-center">
                                <div class="btn-group btn-group-sm">
                                    <button class="btn btn-warning" 
                                            th:data-tag="${asset.assetTag}"
                                            th:data-user="${asset.nombreUsuario}"
                                            th:data-ram="${asset.ram}"
                                            th:data-cpu="${asset.cpu}"
                                            th:data-disco="${asset.disco}"
                                            th:data-so="${asset.versionSo}"
                                            th:data-otros="${asset.otros}"
                                            th:data-planta-id="${asset.planta?.id}"
                                            th:data-tipo="${asset.tipoEquipo}"
                                            onclick="editarDesdeTabla(this)">
                                        <i class="bi bi-pencil-square text-dark"></i>
                                    </button>
                                    <button class="btn btn-danger" th:onclick="|confirmarBorrado('${asset.assetTag}')|">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
