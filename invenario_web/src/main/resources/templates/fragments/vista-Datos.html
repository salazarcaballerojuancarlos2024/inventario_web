<div th:fragment="datos" id="vista-Datos"
	class="seccion-oculta container-fluid mt-4" style="display: none;">
	<div class="card shadow-sm border-0 bg-dark text-white">

		<div class="card-header border-secondary p-3">
			<div class="row g-3 align-items-center">
				<div class="col-md-3">
					<h5 class="mb-0 text-info">
						<i class="bi bi-database-fill me-2"></i>Gestión de Activos
					</h5>
				</div>

				<div class="col-md-2">
					<div class="input-group input-group-sm">
						<label
							class="input-group-text bg-secondary border-secondary text-white">Ver</label>
						<select id="maxRows"
							class="form-select bg-dark text-white border-secondary"
							onchange="cambiarPaginacion()">
							<option value="10">10</option>
							<option value="20">20</option>
							<option value="30">30</option>
							<option value="50">50</option>
							<option value="100">100</option>
							<option value="5000">Todos</option>
						</select>
					</div>
				</div>

				<div
					class="d-flex justify-content-between align-items-center mb-3 px-3">
					<div class="d-flex gap-2 align-items-center flex-wrap">
						<!-- Botón Crear Nuevo -->
						<button
							class="btn btn-success btn-sm shadow d-flex align-items-center"
							onclick="abrirModalCrear()">
							<i class="bi bi-plus-circle me-1"></i> Nuevo Activo
						</button>

						<!-- Botón Borrar Selección Actual -->
						<button id="btnBorrarSeleccion"
							class="btn btn-danger btn-sm shadow d-flex align-items-center gap-2"
							onclick="borrarSeleccionados()" disabled>
							<img th:src="@{/imagenes/papelera.png}" alt="Borrar"
								style="width: 16px; height: 16px; filter: brightness(0) invert(1);">
							<span>Borrar Selección (<span id="countSeleccionados">0</span>)
							</span>
						</button>

						<!-- Botón Exportar Vista CSV Actual -->
						<button
							class="btn btn-outline-info btn-sm shadow d-flex align-items-center gap-2"
							onclick="exportarVistaActualCSV()"
							title="Exportar todos los resultados del filtro actual">
							<img th:src="@{/imagenes/descargas.png}" alt="Exportar"
								style="width: 16px; height: 16px;"> <span>Exportar
								CSV</span>
						</button>

						<!-- Formulario e Input de Importación CSV -->
						<div class="d-inline">
							<input type="file" id="inputCsv" name="archivo" accept=".csv"
								style="display: none;" onchange="ejecutarImportacionCsv(this)">

							<button type="button"
								class="btn btn-outline-success btn-sm shadow d-flex align-items-center gap-1"
								onclick="document.getElementById('inputCsv').click();"
								title="Cargar y volcar activos desde un archivo .csv">
								<i class="bi bi-file-earmark-spreadsheet"></i> <span>Importar
									CSV</span>
							</button>
						</div>
					</div>

					<div style="width: 350px;">
						<div class="input-group input-group-sm">
							<span class="input-group-text bg-secondary border-secondary p-1">
								<img th:src="@{/imagenes/buscador.png}" alt="buscar"
								style="width: 20px; height: 20px;">
							</span> <input type="text" id="inputBusquedaAssets"
								class="form-control bg-dark text-white border-secondary"
								placeholder="Buscar en todas las columnas..."
								oninput="ejecutarFiltroYPaginacion()" autocomplete="off">
						</div>
					</div>
				</div>
			</div>
		</div>

		<div class="card-body p-0" style="max-height: 65vh; overflow-y: auto;">
			<div class="table-responsive">
				<table id="tablaAssets"
					class="table table-dark table-hover mb-0 align-middle">
					<thead class="table-secondary sticky-top"
						style="top: 0; z-index: 10;">
						<tr>
							<th style="width: 40px; text-align: center;"><input
								type="checkbox" id="checkAllAssets"
								onclick="toggleTodosLosChecks(this)" class="form-check-input">
							</th>
							<th onclick="ordenarTablaPaginada(0)"
								style="width: 120px; cursor: pointer;">Tag <span
								class="sort-icon">↕</span></th>
							<th onclick="ordenarTablaPaginada(1)"
								style="width: 180px; cursor: pointer;">Usuario <span
								class="sort-icon">↕</span></th>
							<th onclick="ordenarTablaPaginada(2)"
								style="width: 100px; cursor: pointer;">Tipo <span
								class="sort-icon">↕</span></th>
							<th onclick="ordenarTablaPaginada(3)"
								style="width: 150px; cursor: pointer;">Ubicación <span
								class="sort-icon">↕</span></th>
							<th onclick="ordenarTablaPaginada(4)"
								style="width: 100px; cursor: pointer;">RAM <span
								class="sort-icon">↕</span></th>
							<th onclick="ordenarTablaPaginada(5)"
								style="width: 150px; cursor: pointer;">CPU <span
								class="sort-icon">↕</span></th>
							<th onclick="ordenarTablaPaginada(6)"
								style="width: 100px; cursor: pointer;">Disco <span
								class="sort-icon">↕</span></th>
							<th onclick="ordenarTablaPaginada(7)"
								style="width: 120px; cursor: pointer;">S.O. <span
								class="sort-icon">↕</span></th>
							<th onclick="ordenarTablaPaginada(8)"
								style="width: 200px; cursor: pointer;">Otros <span
								class="sort-icon">↕</span></th>
							<th class="text-center" style="width: 170px; min-width: 170px;">Acciones</th>
						</tr>
					</thead>
					<tbody>
						<th:block th:if="${todosLosAssets != null}">
							<tr th:each="asset : ${todosLosAssets}"
								th:id="'fila-' + ${asset.assetTag}" class="fila-asset"
								th:data-planta-id="${asset.planta?.id}"
								th:data-tag="${asset.assetTag}" style="cursor: pointer;">

								<td style="text-align: center;"
									ondblclick="event.stopPropagation();"><input
									type="checkbox" class="form-check-input check-asset"
									th:value="${asset.assetTag}"
									onclick="actualizarEstadoBotonBorrar()"></td>

								<td class="fw-bold text-info" th:text="${asset.assetTag}"></td>
								<td th:text="${asset.nombreUsuario}"></td>

								<td><span class="badge"
									th:classappend="${asset.tipoEquipo == 'Portátil' ? 'bg-primary' : 'bg-secondary'}"
									th:text="${asset.tipoEquipo}"> </span></td>

								<!-- Safe navigation con ?. para evitar EntityNotFoundException -->
								<td class="fw-bold"
									th:text="${asset.planta?.nombre != null ? asset.planta.nombre : 'Sin Ubicación'}"
									th:classappend="${asset.planta?.nombre == null ? 'text-muted' : 'text-success'}">
								</td>

								<!-- Corregidos los getters para SnipeIT -->
								<td th:text="${asset.snipeitRam}"></td>
								<td th:text="${asset.snipeitCpu}"></td>
								<td th:text="${asset.snipeitDisco}"></td>
								<td th:text="${asset.snipeitVersionSo}"></td>
								<td class="text-truncate" style="max-width: 150px;"
									th:text="${asset.snipeitOtros}" th:title="${asset.snipeitOtros}"></td>

								<td class="text-center" ondblclick="event.stopPropagation();">
									<div class="btn-group">
										<button
											class="btn btn-warning btn-compact d-flex align-items-center gap-1"
											th:data-tag="${asset.assetTag}"
											th:data-user="${asset.nombreUsuario}"
											th:data-ram="${asset.snipeitRam}" 
											th:data-cpu="${asset.snipeitCpu}"
											th:data-disco="${asset.snipeitDisco}"
											th:data-so="${asset.snipeitVersionSo}"
											th:data-otros="${asset.snipeitOtros}"
											th:data-planta-id="${asset.planta?.id}"
											th:data-tipo="${asset.tipoEquipo}"
											onclick="prepararModalDesdeIcono(this)">
											<i class="bi bi-pencil-square"></i> <span>Editar</span>
										</button>

										<button
											class="btn btn-danger btn-compact d-flex align-items-center gap-1"
											th:data-tag="${asset.assetTag}"
											onclick="confirmarEliminarAsset(this.getAttribute('data-tag'))">
											<i class="bi bi-trash"></i> <span>Borrar</span>
										</button>
									</div>
								</td>
							</tr>
						</th:block>
					</tbody>
				</table>
			</div>
		</div>

		<div
			class="card-footer border-secondary d-flex justify-content-between align-items-center bg-darker p-2">
			<div>
				<nav>
					<ul class="pagination pagination-sm mb-0" id="pagination-wrapper"></ul>
				</nav>
			</div>
			<div class="text-muted small">
				Mostrando <span id="countPage" class="text-info fw-bold">0</span> de
				<span id="countTotal" class="text-white fw-bold"
					th:text="${todosLosAssets != null ? #lists.size(todosLosAssets) : 0}">0</span>
				activos
			</div>
		</div>
	</div>

	<script th:inline="javascript">
    (function() {
        console.log("✅ Scripts de 'vista-Datos' cargados correctamente");

        // -------------------------------------------------------------
        // 1. IMPORTACIÓN DE CSV (Hacia /assets/importar-csv)
        // -------------------------------------------------------------
        window.ejecutarImportacionCsv = function(input) {
            console.log("--> 1. Detectado cambio de archivo en el input CSV");

            if (!input || !input.files || input.files.length === 0) {
                console.warn("No se ha seleccionado ningún archivo.");
                return;
            }

            const file = input.files[0];
            console.log("--> 2. Archivo preparado:", file.name, "| Tamaño:", file.size, "bytes");

            const confirmacion = confirm(`¿Deseas importar los activos del archivo "${file.name}" a la Base de Datos?`);
            
            if (!confirmacion) {
                console.log("Cancelado por el usuario.");
                input.value = '';
                return;
            }

            console.log("--> 3. Enviando archivo POST hacia /assets/importar-csv...");

            const formData = new FormData();
            formData.append("archivo", file);

            fetch('/assets/importar-csv', {
                method: 'POST',
                body: formData
            })
            .then(async response => {
                console.log("--> 4. Respuesta HTTP recibida con estado:", response.status);
                const data = await response.json();
                
                if (response.ok && data.exito) {
                    alert(`¡Importación completada con éxito!\n\nSe han procesado y guardado ${data.registrosProcesados} activos en la base de datos.`);
                    location.reload(); 
                } else {
                    alert("Error al importar el archivo CSV:\n\n" + (data.error || "Formato de archivo no válido."));
                }
            })
            .catch(err => {
                console.error("--> Error crítico en la petición Fetch:", err);
                alert("Ocurrió un error al procesar el archivo en el servidor: " + err.message);
            })
            .finally(() => {
                input.value = ''; // Limpiar el input para permitir volver a subir el mismo archivo si es necesario
            });
        };

        // -------------------------------------------------------------
        // 2. NAVEGACIÓN POR DOBLE CLIC EN FILA DE LA TABLA
        // -------------------------------------------------------------
        document.addEventListener('dblclick', function (e) {
            const fila = e.target.closest('.fila-asset');
            if (!fila || e.target.closest('button') || e.target.closest('input')) {
                return;
            }

            const plantaId = fila.getAttribute('data-planta-id');
            const assetTag = fila.getAttribute('data-tag');

            console.log("🚀 Doble clic en Asset:", assetTag, "Hacia Planta ID:", plantaId);

            if (plantaId && plantaId !== "null") {
                const seccion = (plantaId === "1") ? "vista-almacen" : "vista-plano";
                const destino = `/?plantaId=${plantaId}&seccion=${seccion}`;
                window.location.href = destino;
            } else {
                alert("Este activo no tiene ubicación asignada en la base de datos.");
            }
        });
    })();
</script>
</div>
