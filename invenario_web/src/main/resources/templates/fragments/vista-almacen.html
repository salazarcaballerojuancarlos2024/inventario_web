<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
	<div th:fragment="almacen" id="vista-almacen"
		class="h-100 seccion-oculta" style="min-height: 100vh; width: 100%;">
		<div class="d-flex h-100 w-100 overflow-hidden"
			style="background-color: #f8f9fa;">
			<div class="d-flex flex-column flex-grow-1 h-100 border-end">
				<div class="zona-arrastre-almacen position-relative" id="contenedor-almacen" 
    				 style="flex: 0 0 75%; background-color: #ffffff; overflow: hidden; border-bottom: 2px solid #dee2e6;">
					<div class="watermark-almacen">
						<img th:src="@{/imagenes/almacen.png}" alt="Almacén"> <span>ZONA
							DE ALMACÉN</span>
					</div>
					<div th:each="asset : ${assets}"
						th:if="${asset.planta != null and asset.planta.id == 1}"
						class="pc-icon drag-item" 
						th:id="'icono-' + ${asset.assetTag}"
						th:data-tag="${asset.assetTag}" 
						th:data-x="${asset.posX ?: 0}"
						th:data-y="${asset.posY ?: 0}"
						th:style="'transform: translate(' + (${asset.posX ?: 0}) + 'px, ' + (${asset.posY ?: 0}) + 'px);'"			
						th:onmouseenter="'resaltarFila(\'' + ${asset.assetTag} + '\', true)'"
						th:onmouseleave="'resaltarFila(\'' + ${asset.assetTag} + '\', false)'"
						ondblclick="manejarClickIcono(this, event)">
						<img
							th:src="${asset.tipoEquipo != null and (#strings.toLowerCase(asset.tipoEquipo) == 'portátil' or #strings.toLowerCase(asset.tipoEquipo) == 'portatil') ? '/imagenes/ordenador-portatil.png' : '/imagenes/ordenador-sobremesa.png'}"
							alt="Icono"> <span th:text="${asset.assetTag}"></span>
						<div class="tooltip-datos shadow">
							<div
								class="text-center fw-bold text-warning mb-1 border-bottom border-secondary pb-1">FICHA
								TÉCNICA</div>

							<div class="mb-1">
								<span class="label-tt">Tag:</span> <span
									th:text="${asset.assetTag}"></span>
							</div>
							<div class="mb-1">
								<span class="label-tt">Tipo:</span> <span
									th:text="${asset.tipoEquipo}"></span>
							</div>
							<div class="mb-1">
								<span class="label-tt">User:</span> <span
									th:text="${asset.nombreUsuario}"></span>
							</div>
							<div class="mb-1">
								<span class="label-tt">Ubicación:</span> <span
									th:text="${asset.planta.nombre}"></span>
							</div>

							<hr style="border-color: #555; margin: 5px 0;">

							<div class="mb-1">
								<span class="label-tt">RAM:</span> <span th:text="${asset.ram}"></span>
							</div>
							<div class="mb-1">
								<span class="label-tt">CPU:</span> <span th:text="${asset.cpu}"></span>
							</div>
							<div class="mb-1">
								<span class="label-tt">Disco:</span> <span
									th:text="${asset.disco}"></span>
							</div>
							<div class="mb-1">
								<span class="label-tt">S.O:</span> <span
									th:text="${asset.versionSo}"></span>
							</div>

							<div class="mb-1"
								th:if="${asset.otros != null and !asset.otros.empty}">
								<span class="label-tt">Otros:</span> <span
									th:text="${asset.otros}"
									style="color: #eee; font-size: 0.65rem;"></span>
							</div>

							<div
								class="text-end text-info mt-1 pt-1 border-top border-secondary"
								style="font-size: 0.65rem;">
								X: <span class="tt-pos-x" th:id="'tt-x-' + ${asset.assetTag}" th:text="${asset.posX}"></span> | 
               				    Y: <span class="tt-pos-y" th:id="'tt-y-' + ${asset.assetTag}" th:text="${asset.posY}"></span>
							</div>
						</div>
					</div>
				</div>
				<div class="bg-white overflow-hidden" style="flex: 0 0 25%;">
					<div class="h-100 overflow-auto">
						<table
							class="table table-hover align-middle m-0 table-almacen-compacta"
							id="tablaAlmacen"
							style="font-size: 0.7rem; table-layout: fixed; width: 100%;">
							<thead class="table-dark sticky-top">
								<tr style="cursor: pointer;">
									<th onclick="ordenarTabla(0)" style="width: 7%;">Tag ↕</th>
									<th onclick="ordenarTabla(1)" style="width: 8%;">Tipo ↕</th>
									<th onclick="ordenarTabla(2)" style="width: 12%;">Usuario
										↕</th>
									<th onclick="ordenarTabla(3)" style="width: 10%;">Ubicación
										↕</th>
									<th onclick="ordenarTabla(4)" style="width: 6%;">RAM ↕</th>
									<th onclick="ordenarTabla(5)" style="width: 10%;">CPU ↕</th>
									<th onclick="ordenarTabla(6)" style="width: 7%;">Disco ↕</th>
									<th onclick="ordenarTabla(7)" style="width: 9%;">S.O. ↕</th>
									<th onclick="ordenarTabla(8)" style="width: 12%;">Otros ↕</th>
									<th class="text-center" style="width: 8%;">X / Y</th>
									<th class="text-center" style="width: 11%;">Acciones</th>
								</tr>
							</thead>
							<tbody>
								<tr th:each="asset : ${assets}"
									th:if="${asset.planta != null and asset.planta.id == 1}"
									th:id="'fila-' + ${asset.assetTag}">
									<td th:text="${asset.assetTag}" class="fw-bold text-success"></td>
									<td th:text="${asset.tipoEquipo}" class="text-uppercase small"></td>
									<td th:text="${asset.nombreUsuario}" class="text-truncate"></td>
									<td th:text="${asset.planta.nombre}"></td>
									<td th:text="${asset.ram}"></td>
									<td th:text="${asset.cpu}" class="text-truncate"></td>
									<td th:text="${asset.disco}"></td>
									<td th:text="${asset.versionSo}"></td>
									<td th:text="${asset.otros}" class="text-muted text-truncate"
										th:title="${asset.otros}"></td>
									<td class="text-center font-monospace"
										style="font-size: 0.65rem;"><span
										th:id="'table-x-' + ${asset.assetTag}"
										th:text="${asset.posX ?: 0}"></span>/<span
										th:id="'table-y-' + ${asset.assetTag}"
										th:text="${asset.posY ?: 0}"></span></td>
									<td class="text-center">
										<div class="d-flex justify-content-center gap-1">
											<button class="btn btn-outline-primary btn-sm py-0 px-2"
												style="font-size: 0.65rem;"
												th:onclick="abrirModalUpdate([[${asset.assetTag}]], [[${asset.nombreUsuario}]], [[${asset.ram}]], [[${asset.cpu}]], [[${asset.disco}]], [[${asset.versionSo}]], [[${asset.otros}]], [[${asset.planta.id}]], [[${asset.tipoEquipo}]])">
												Editar</button>

											<button
												class="btn btn-warning btn-sm py-0 px-2 text-dark fw-bold"
												style="font-size: 0.65rem;"
												th:onclick="confirmarEliminarAsset([[${asset.assetTag}]])">
												Eliminar</button>
										</div>
									</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>
			<div
				class="sidebar-almacen-control bg-dark text-white p-3 d-flex flex-column shadow"
				style="width: 240px; flex-shrink: 0;">
				<h6
					class="text-uppercase fw-bold text-info mb-3 border-bottom border-secondary pb-2 small">Transferir
					a Planta</h6>
				<div class="flex-grow-1 overflow-auto pe-1 mb-3">
					<div th:each="p : ${plantas}" th:if="${p.id != 1}"
						class="planta-dropzone mb-2" th:data-planta-id="${p.id}">
						<div class="dropzone-label" th:text="${p.nombre}"></div>
						<small style="font-size: 0.55rem; opacity: 0.5;">SOLTAR
							PARA MOVER</small>
					</div>
				</div>
				<div class="d-grid gap-2 border-top border-secondary pt-3">
					<button class="btn btn-success btn-sm fw-bold"
						onclick="guardarTodoAlmacen()">GUARDAR CAMBIOS</button>
					<button class="btn btn-outline-info btn-sm text-white"
						onclick="exportarAlmacen()">EXPORTAR LISTA</button>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
